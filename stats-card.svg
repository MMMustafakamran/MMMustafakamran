<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#e6edf3}
.lbl{font-size:14px;fill:#8b949e} .num{font-size:38px;font-weight:700} .unit{font-size:15px;fill:#8b949e} .sub{font-size:12.5px;fill:#8b949e} .ax{font-size:12px;fill:#8b949e} .hot{fill:#39d353}
.t{opacity:0;animation:up .5s ease-out forwards}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.b{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .7s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes grow{to{transform:scaleY(1)}}
.live{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
</style>
